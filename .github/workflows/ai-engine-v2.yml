name: AI Engine V2 checks

on:
  push:
    branches:
      - feat/ai-engine-v2
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'tests/**'
      - '.github/workflows/ai-engine-v2.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check lib/ai/provider-policy.js
          node --check tests/provider-policy.test.js
      - name: Run unit tests
        run: node --test tests/*.test.js
